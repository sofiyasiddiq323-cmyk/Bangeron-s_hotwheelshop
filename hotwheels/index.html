<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hot Wheels Shop</title>

  <style>

    body{
      font-family:Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:30px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    h1{
      text-align:center;
      color:#cc0000;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 10px 20px rgba(0,0,0,0.08);
      text-align:center;
      max-width:400px;
      margin:auto;
    }

    .card img{
      width:100%;
      height:320px;
      object-fit:cover;
      border-radius:15px;
    }

    .title{
      font-size:28px;
      margin-top:15px;
      color:#333;
      font-weight:bold;
    }

    .price{
      color:#cc0000;
      font-size:24px;
      font-weight:bold;
      margin:15px 0;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:30px;
      font-size:18px;
      cursor:pointer;
      margin-top:15px;
      font-weight:bold;
      transition:0.3s;
    }

    .buy-btn{
      background:#cc0000;
      color:white;
    }

    .buy-btn:hover{
      background:#a80000;
    }

    .whatsapp-btn{
      background:#25d366;
      color:white;
      text-decoration:none;
      display:block;
      line-height:55px;
    }

    .whatsapp-btn:hover{
      background:#1ebe5d;
    }

  </style>
</head>

<body>

  <div class="container">

    <h1>🔥 My Hot Wheels Shop</h1>

    <div class="card">

      <!-- YOUR IMAGE -->
      <img src="sigma.jpeg">

      <div class="title">
        Subaru BRZ
      </div>

      <div class="price">
        RM 45.00
      </div>

      <!-- BUY BUTTON -->
      <button 
        class="btn buy-btn"
        onclick="buyNow()"
      >
        🛒 Order Now
      </button>

      <!-- WHATSAPP BUTTON -->
      <a 
        href="https://wa.me/60175402786?text=Hi%20I%20want%20to%20buy%20the%20Subaru%20BRZ"
        target="_blank"
        class="btn whatsapp-btn"
      >
        💬 Contact Seller
      </a>

    </div>

  </div>

  <script>

    function buyNow(){

      alert(
        "🎉 Item Added!\n\n" +
        "Please contact seller on WhatsApp to confirm your order."
      );

    }

  </script>

</body>
</html>
